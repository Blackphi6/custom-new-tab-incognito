<!doctype html>
<meta charset="utf-8">
<title>Custom New Tab (Incognito)</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui, sans-serif; width: 340px; margin: 0; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  section + section { margin-top: 16px; }
  input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; }
  button { margin-top: 14px; width: 100%; padding: 8px; font-size: 14px; border: 0; border-radius: 6px;
           background: #4f46e5; color: #fff; cursor: pointer; }
  label { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12px; cursor: pointer; }
  #msg { min-height: 1.2em; margin-top: 8px; font-size: 12px; }
</style>
<section>
  <h1>新しいタブのURL</h1>
  <input id="url" type="text" placeholder="https://example.com" autofocus>
  <label><input id="focus" type="checkbox"> Focus on the address bar on the new tab page</label>
</section>
<section>
  <h1>新しいシークレットタブのURL</h1>
  <input id="incognitoUrl" type="text" placeholder="空欄なら上と同じURL">
  <label><input id="incognitoFocus" type="checkbox"> Focus on the address bar on the new tab page</label>
</section>
<button id="save">保存</button>
<div id="msg"></div>
<script src="popup.js"></script>
